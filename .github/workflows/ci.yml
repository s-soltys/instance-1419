name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 9-Gate Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Fast Gates (1-8)
        env:
          VOICE_SYNC_STRICT: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' || github.event_name == 'release') && '1' || '0' }}
        run: npm run verify:fast

      - name: Run Full Visual E2E (Gate 9)
        run: npm run test:visual

      - name: Upload visual E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-screenshots
          path: artifacts/e2e-visual
          retention-days: 7
          if-no-files-found: ignore
